services:
  - type: web
    name: campusflow-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt python-multipart"
    startCommand: "python app.py"
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
